<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八种阅读的邀请 · 首页卡片探索</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#131921;font-family:Figtree,'PingFang SC',sans-serif}main{max-width:1760px;margin:auto;padding:56px 32px}header{max-width:800px;margin-bottom:40px}header>p:first-child{color:#909399;letter-spacing:2px;font-size:12px}h1{font-size:36px;line-height:1.4;margin:12px 0}header>p:last-child{font-size:15px;line-height:1.8;color:#606266}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}.study{min-width:0}.study h2{margin:0;font-size:20px;line-height:30px}.study h2 span{color:#909399;font-size:13px;margin-right:8px;font-variant-numeric:tabular-nums}.study p{font-size:13px;line-height:22px;color:#606266;min-height:44px;margin:10px 0 14px}.study a{display:inline-block;margin-bottom:16px;color:#131921;font-size:13px;text-underline-offset:5px}.phone{border:1px solid #e4e7ed;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 8px 32px #22263208;height:1060px}iframe{display:block;width:100%;height:100%;border:0}footer{margin-top:40px;font-size:13px;line-height:24px;color:#909399}@media(max-width:1300px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.phone{max-width:440px}}@media(max-width:650px){main{padding:32px 16px}.grid{grid-template-columns:1fr;gap:40px}h1{font-size:28px}.phone{height:900px}.study p{min-height:0}}
</style></head><body><main><header><p>LONGYUAN · MOBILE HOME STUDIES</p><h1>八种阅读的邀请</h1><p>相同内容，八种卡片排版。向下滚动每个预览，可比较图书、杂志、文章与播客；点击“打开方案”可在手机上单独体验。顶部导航、日历和页面导语沿用原版。</p></header><div class="grid" id="studies"></div><footer>探索版与原首页分开保存。预览中的分享和日期状态独立，不影响原版。<br><a href="index.html" style="color:inherit">查看原首页</a></footer></main><script>
const studies=[['编辑书页','以宋体标题、细分隔线和舒展行距，建立像翻开书页一样的阅读节奏。'],['封面橱窗','先看见一本书，再被一个问题吸引。封面居中，身份、导读与推荐分层。'],['阅读信笺','暖纸色与柔和边框，像收到一封有出处、有旁注的阅读来信。'],['侧边书签','紧凑的来源区与左侧书签，先建立可信出处，再进入问题与正文。'],['沉浸扉页','大封面与柔和舞台先建立情绪，再用清晰的白底文字邀请阅读。'],['双页书摘','将推荐与出处分成上下两页，正文更从容，理由和行动收在第二页。'],['极光阅读','延续项目的柔光气质，以浅极光外框和白色内页承托内容。'],['索引周刊','大序号、清楚的横线和有力度的标题，形成可持续向下读的编辑索引。']];document.querySelector('#studies').innerHTML=studies.map(([name,desc],i)=>`<section class="study"><h2><span>${String(i+1).padStart(2,'0')}</span>${name}</h2><p>${desc}</p><a href="home-explore.html?v=${i+1}" target="_blank" rel="noopener">打开方案 ${String(i+1).padStart(2,'0')} ↗</a><div class="phone"><iframe src="home-explore.html?v=${i+1}" title="${name}首页卡片探索" loading="lazy"></iframe></div></section>`).join('');
</script></body></html>
